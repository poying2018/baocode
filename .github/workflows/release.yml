# Builds BaoCode for Windows and publishes it to this repository's
# release, where installed apps find their updates. docs/release.md has the
# whole of it: versions, secrets, what goes where.
#
#   git tag v1.2.0 && git push origin v1.2.0   build and publish 1.2.0, the
#                                              standard build and the channel
#                                              build (lib/channel/), each
#                                              updating to its own
#   git tag test-foo && git push origin test-foo
#                                              build, and put the installers
#                                              at the release, to send to
#                                              testers (no update)
#                                              send to testers (no update)
#   git tag test-channel-foo && git push origin test-channel-foo
#                                              the same, of the channel build
#                                              alone
#   git tag v1.2.0-channel && git push origin v1.2.0-channel
#                                              the channel build alone, signed
#                                              into 1.2.0 as published; the
#                                              standard build left as it is
#   Actions → Release → Run workflow           build only, to try the build
#                                              (the editions asked for)
#
# The remote server alone: a server-* tag (remote.yml, which this calls).
#
# A version may be published again (the tag moved to a fixed commit): the
# links end in each file's hash, so the CDN serves the new files at once.
# Installed apps already on that version are not offered it again.
name: Release

on:
  push:
    tags: ['v*', 'test-*']
  workflow_dispatch:
    inputs:
      editions:
        description: The builds to make
        type: choice
        default: both
        options: [both, standard, channel]

permissions:
  contents: read

# One release at a time; one that started is never cancelled halfway
# through its upload. A build for testers, or run by hand, publishes no
# release, and waits for none.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      marketing: ${{ steps.version.outputs.marketing }}
      publish: ${{ steps.version.outputs.publish }}
      editions: ${{ steps.version.outputs.editions }}
      channel_only: ${{ steps.version.outputs.channel_only }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read pubspec.yaml's version, and match the tag against it
        env:
          EDITIONS: ${{ inputs.editions }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          marketing=${version%%+*}
          code=$(sed -n "s/^const appVersionString = '\(.*\)';/\1/p" lib/update/version.dart)
          echo "pubspec.yaml: $version, lib/update/version.dart: $code"
          if [ "$version" != "$code" ]; then
            echo "::error::lib/update/version.dart says $code, pubspec.yaml $version: run tool/bump_version.dart"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::$version is not x.y.z+build"
            exit 1
          fi
          publish=false
          channel_only=false
          # A release has both: each edition's installs update to its own.
          editions='["standard","channel"]'
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == test-channel-* ]]; then
            editions='["channel"]'
          elif [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == test-* ]]; then
            editions='["standard"]'
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$EDITIONS" in
              standard) editions='["standard"]' ;;
              channel) editions='["channel"]' ;;
            esac
          elif [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == *-channel ]]; then
            # The channel build alone, signed into the version published,
            # whose standard build is left as it is.
            if [ "$GITHUB_REF_NAME" != "v$marketing-channel" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but pubspec.yaml is $version: the tag has to be v$marketing-channel"
              exit 1
            fi
            published=$(curl -fsS "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" | jq -r .version)
            if [ "$published" != "$version" ]; then
              echo "::error::$published is published, pubspec.yaml is $version: the channel build alone goes beside the version published"
              exit 1
            fi
            publish=true
            channel_only=true
            editions='["channel"]'
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$marketing" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but pubspec.yaml is $version: the tag has to be v$marketing"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "marketing=$marketing"
            echo "publish=$publish"
            echo "editions=$editions"
            echo "channel_only=$channel_only"
          } >> "$GITHUB_OUTPUT"
          echo "Builds: $editions"
      - name: Be no older than the version published
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.channel_only != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          published=$(curl -fsS "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" | jq -r .version || true)
          echo "Published: ${published:-none}, this: $VERSION"
          [ -z "$published" ] && exit 0
          # x.y.z+build, compared number by number.
          python3 - "$published" "$VERSION" <<'EOF'
          import re, sys
          def key(v):
              m = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+(\d+))?', v)
              return tuple(int(x or 0) for x in m.groups())
          published, this = sys.argv[1:]
          if key(this) < key(published):
              sys.exit(f'::error::{this} is older than {published}, which is published: installed apps would not take it')
          if key(this) == key(published):
              print(f'::warning::{this} is published already: publishing it again')
          EOF

  # Once, for both apps: they carry its servers.json, and download the
  # build a host needs (docs/ssh-remote.md, 9.3). Its
  # artifacts: remote (VERSION, servers.json, the .gz), remote-linux.
  remote:
    name: Remote server
    needs: check
    uses: ./.github/workflows/remote.yml

  # Each build once per edition (check's editions): the channel build's
  # files and artifacts end in -channel.
  windows:
    name: Build for Windows (${{ matrix.edition }})
    needs: [check, remote]
    runs-on: windows-latest
    strategy:
      # One edition failing leaves the other building, to be re-run alone.
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.check.outputs.editions) }}
    env:
      SUFFIX: ${{ matrix.edition == 'channel' && '-channel' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: build/remote
      - name: Build
        run: dart run tool/build_windows.dart --remote-built ${{ matrix.edition == 'channel' && '--channel' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows${{ env.SUFFIX }}
          if-no-files-found: error
          path: build/installers/BaoCode-*-setup${{ env.SUFFIX }}.exe
      # The Dart code's symbols, for a hang report's app.so+0x… frames
      # (tool/build_windows.dart). Not released: kept with the run.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows${{ env.SUFFIX }}
          if-no-files-found: error
          retention-days: 90
          path: build/symbols/app.windows-x64.symbols

  publish:
    name: Publish to this repository's release
    needs: [check, remote, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The update signing key is this repository's secret (the same one the
    # app's own manifest is signed with).
    permissions:
      contents: write # the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MARKETING: ${{ needs.check.outputs.marketing }}
      # v<version>-channel: the channel build alone, into the version
      # published.
      CHANNEL_ONLY: ${{ needs.check.outputs.channel_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Gather the files
        run: |
          mkdir -p out
          # The standard build, then the channel build's, ending in -channel.
          # This fork publishes the Windows build only: the macOS one is not
          # built or published any more, and the Linux one is built by hand
          # when it is wanted.
          editions=('' -channel)
          [ "$CHANNEL_ONLY" = true ] && editions=(-channel)
          for edition in "${editions[@]}"; do
            cp dist/windows$edition/BaoCode-$MARKETING-setup$edition.exe out/
          done
          # The remote server's builds too: an app packaged before them (or
          # one built on another machine) downloads them from the release,
          # by the version it was built with.
          for file in dist/remote/*.gz dist/remote/servers.json; do
            cp "$file" out/
          done
          find out -type f | sort
      - name: Sign the release into latest.json
        env:
          SIGNING_KEY: ${{ secrets.BAOCODE_UPDATE_SIGNING_KEY }}
        run: |
          flutter pub get
          key="$RUNNER_TEMP/update-signing.key"
          echo "$SIGNING_KEY" > "$key"
          notes=()
          editions=('' -channel)
          if [ "$CHANNEL_ONLY" = true ]; then
            # The manifest published, which the channel build's entries join:
            # the standard build's, its notes and its downloads kept as they
            # are (release_manifest.dart keeps a manifest of the same version).
            editions=(-channel)
            curl -fsS "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" -o out/latest.json
            [ "$(jq -r .version out/latest.json)" = "$VERSION" ] || { echo "::error::latest.json is not $VERSION"; exit 1; }
          fi
          for language in en zh; do
            [ "$CHANNEL_ONLY" = true ] && break
            file="release-notes/$MARKETING.$language.md"
            if [ -f "$file" ]; then
              notes+=(--notes-$language "$file")
            else
              echo "::warning::No $file: the update notification and the changelog say nothing of $MARKETING"
            fi
          done
          files=()
          for edition in "${editions[@]}"; do
            files+=(
              --windows$edition out/BaoCode-$MARKETING-setup$edition.exe
            )
          done
          BAOCODE_UPDATE_SIGNING_KEY="$key" dart run tool/release_manifest.dart \
            --version "$VERSION" \
            "${files[@]}" \
            --manifest out/latest.json \
            "${notes[@]}"
          rm "$key"
      - name: Make the GitHub release, with its assets
        if: env.CHANNEL_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          [ -f "release-notes/$MARKETING.en.md" ] && notes=(--notes-file "release-notes/$MARKETING.en.md")
          # Published again: the release is made anew, on the tag's commit.
          gh release delete "v$MARKETING" --yes 2>/dev/null || true
          gh release create "v$MARKETING" --title "BaoCode $MARKETING" "${notes[@]}"
          # Every build gathered: the standard one and the channel build's,
          # whose files end in -channel. The manifest names both, so both
          # are here.
          for file in out/BaoCode-*; do
            gh release upload "v$MARKETING" "$file" --clobber
          done
      - name: Upload the remote server, beside the release
        if: env.CHANNEL_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The remote server's builds are published here too, so an app
          # built months ago still downloads the one it was built with.
          version=$(cat dist/remote/VERSION)
          for file in dist/remote/*.gz dist/remote/servers.json; do
            gh release upload "v$MARKETING" "$file" --clobber
          done
          jq -n --arg version "$version" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '{version: $version, tag: $tag, commit: $commit}' > remote-latest.json
          gh release upload "v$MARKETING" remote-latest.json --clobber
      - name: Upload latest.json, last
        if: env.CHANNEL_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app reads this from the release beside the installers; it
          # is uploaded last, so an app that sees it finds the files it
          # names.
          gh release upload "v$MARKETING" out/latest.json --clobber
