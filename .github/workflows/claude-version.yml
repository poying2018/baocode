# Keeps the Claude Code the Windows bundle carries current.
#
# The bundle carries Claude Code itself (tool/build_windows.dart), so that a
# machine with none of its own needs no install and no download. That copy
# cannot update itself - it would put another in the user's ~/.local - so
# the version and the SHA-256 of the build it is are pinned, and this is
# what keeps the pin at the current build.
#
#   Actions -> Claude Code version -> Run workflow
#                                      bump it now
#
# It runs on its own every day. The release's own check (release.yml) says
# so when the pin is behind, which this workflow is what keeps from
# happening: the check is the backstop, this is the keeping up.
#
# The pin is changed in one commit, on main, by the bot. The build then
# carries that one build: it is checked against the SHA-256 in the pin, so
# a build carries that build and no other.
name: Claude Code version

on:
  schedule:
    # Once a day, at a quiet hour (UTC).
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the pinned Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The checkout is the commit the schedule fired on; a push that landed
      # while the run was queued would otherwise be the base the bump is
      # written on, and the rebase below would move it after the fact (or
      # collide). Read main as it is now, before writing anything.
      - name: Read main as it is now
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: dart-lang/setup-dart@v1
        with:
          version: stable
      - name: Put the current build in the pin
        run: dart tool/bump_claude_version.dart --write
      - name: Commit it
        run: |
          if git diff --quiet; then
            echo "The pin is at the current build."
            exit 0
          fi
          version=$(sed -n "s/^const _claudeVersion = '\(.*\)';/\1/p" tool/build_windows.dart)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "ci(claude): bump Claude Code to $version"
          # Someone may have pushed while the tool read the channel and
          # wrote the pin; rebase once, and if their commit moved the pin
          # too, the push below says so rather than landing a stale bump.
          git pull --rebase origin main
          git push
          {
            echo "## Claude Code $version"
            echo
            echo "The build the Windows bundle carries is now Claude Code $version."
          } >> "$GITHUB_STEP_SUMMARY"
