# Signs a release's manifest with the key kept in the repository's
# BAOCODE_UPDATE_SIGNING_KEY secret — the private key never sits on a
# disk: GitHub holds it encrypted, and only this repository's workflows
# can read it.
#
#   Actions → Sign release manifest → Run workflow
#     tag    the release to sign, e.g. v1.2.0+14 (checked out, so the
#            manifest carries that tag's pubspec version)
#     asset  the installer already uploaded to that release
#
# It downloads the installer from the release, signs its SHA-256, and
# uploads latest.json beside it (the app reads
# releases/latest/download/latest.json).
name: Sign release manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0+14)'
        required: true
      asset:
        description: 'Installer asset name in that release (empty: the standard one)'
        required: false
        default: ''
      notes-zh:
        description: 'Release notes (zh), optional'
        required: false
      notes-en:
        description: 'Release notes (en), optional'
        required: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - id: installer
        name: Find and download the installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          asset="$ASSET"
          if [ -z "$asset" ]; then
            # The standard build of the release named: no stale default to
            # outlive it, and the channel build's own file is not it.
            asset=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
              --jq '[.assets[].name | select(test("^BaoCodeClaude-.*-setup\\.exe$")) | select(endswith("-channel.exe") | not)][0] // ""')
          fi
          [ -n "$asset" ] || { echo "::error::No installer found in $TAG: name one with the asset input."; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Sign the manifest
        env:
          BAOCODE_UPDATE_SIGNING_KEY: ${{ runner.temp }}/signing.key
          SIGNING_SEED: ${{ secrets.BAOCODE_UPDATE_SIGNING_KEY }}
          NOTES_ZH: ${{ inputs.notes-zh }}
          NOTES_EN: ${{ inputs.notes-en }}
        run: |
          if [ -z "$SIGNING_SEED" ]; then
            echo "::error::The BAOCODE_UPDATE_SIGNING_KEY secret is not set."
            exit 1
          fi
          printf '%s\n' "$SIGNING_SEED" > "$BAOCODE_UPDATE_SIGNING_KEY"
          args=(--windows "$RUNNER_TEMP/${{ steps.installer.outputs.asset }}" \
                --manifest "$RUNNER_TEMP/latest.json")
          [ -n "$NOTES_ZH" ] && args+=(--notes-zh "$NOTES_ZH")
          [ -n "$NOTES_EN" ] && args+=(--notes-en "$NOTES_EN")
          dart run tool/release_manifest.dart "${args[@]}"

      - name: Upload the manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" "$RUNNER_TEMP/latest.json" \
            --repo "${{ github.repository }}" --clobber
